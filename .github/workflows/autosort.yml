name: Gmail Autosort

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  autosort:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      # GitHub pauses scheduled jobs after 60 days without repo activity. This resets that clock.
      - name: Keep schedule active
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/autosort.yml/enable

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Write credentials
        run: |
          echo '${{ secrets.GMAIL_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GMAIL_TOKEN }}' > token.json

      - name: Run autosort
        run: python gmail_auto_sort.py
